<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>سجل الحالات</title>
<style>
:root{--bg:#eef6f4;--card:#fff;--tx:#17312d;--mu:#5d7a75;--ac:#0f766e;--ac2:#fbbf24;--bd:#cfe3de;--dn:#b42318;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1e1c;--card:#172b28;--tx:#e6f3f0;--mu:#8fb0aa;--ac:#2dd4bf;--ac2:#fbbf24;--bd:#27443f;--dn:#f97066;--ok:#4ade80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px}
#app{max-width:640px;margin:0 auto;padding:16px 14px 90px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:26px;margin:8px 0 4px}h3{margin:0 0 8px}
p.s{color:var(--mu);margin:0 0 16px}
button{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:11px 14px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){button.pri{color:#06201c}}
button.dan{color:var(--dn);border-color:var(--dn)}
button.pr{color:var(--ok);border-color:var(--ok);font-weight:700;min-width:70px}
button.ab{color:var(--dn);border-color:var(--dn);font-weight:700;min-width:70px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card .g{flex:1;cursor:pointer}
.bn{font-size:18px;font-weight:700}
.chip{display:inline-block;background:var(--ac2);color:#3b2a00;border-radius:8px;padding:2px 9px;font-size:13px;margin-top:6px}
.mu{color:var(--mu);font-size:14px;margin-top:4px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.bar .t{flex:1;font-weight:700;font-size:19px}
.dn{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.dn input{flex:1;text-align:center;font-weight:700}
input,select,textarea{font:inherit;width:100%;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:90px}
.sum{color:var(--mu);margin:2px 2px 12px;font-size:14px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(18px + env(safe-area-inset-bottom));padding:15px 22px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;z-index:9}
.box{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px}
.box label{display:block;margin:10px 0 4px;color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="m"></div>
<script>
var K='pedpt_v1';
var DEF={title:'سجل الحالات',
 labels:{name:'اسم الطفل',section:'القسم',present:'حضر',absent:'غاب'},
 branches:[{id:'b1',name:'الفرع الأول'}],
 sections:['علاج طبيعي','تخاطب','تكامل حسي'],cases:{}};
function load(){try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r);for(var k in DEF)if(!(k in o))o[k]=DEF[k];o.labels=Object.assign({},DEF.labels,o.labels);return o}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
var S=load(),v={p:'home',b:null,d:fmt(new Date())};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shift(d,n){var t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return fmt(t)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(i){return document.getElementById(i)}

function modal(title,fields,onSave,onDel,okText){
 var m=$('m'),h='<div class="box"><h3>'+esc(title)+'</h3>';
 fields.forEach(function(f,i){
  h+='<label>'+esc(f.l)+'</label>';
  if(f.o){var o=f.o.slice();if(f.v&&o.indexOf(f.v)<0)o.unshift(f.v);
   h+='<select id="f'+i+'">'+o.map(function(x){return '<option'+(x==f.v?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'}
  else if(f.t=='area')h+='<textarea id="f'+i+'">'+esc(f.v)+'</textarea>';
  else h+='<input id="f'+i+'" type="'+(f.t||'text')+'" value="'+esc(f.v)+'">';
 });
 h+='<div class="row"><button class="pri" id="ok">'+(okText||'حفظ')+'</button>'+(onDel?'<button class="dan" id="del">حذف</button>':'')+'<button id="no">إلغاء</button></div></div>';
 m.innerHTML=h;m.style.display='flex';
 $('no').onclick=close;
 $('ok').onclick=function(){var vals=fields.map(function(f,i){return $('f'+i).value});if(onSave(vals)!==false)close()};
 if(onDel)$('del').onclick=function(){ask('هل أنت متأكد من الحذف؟',function(){onDel();close()})};
 m.onclick=function(e){if(e.target===m)close()};
}
function ask(msg,yes){
 var m=$('m');
 m.innerHTML='<div class="box"><h3>'+esc(msg)+'</h3><div class="row"><button class="dan" id="y">نعم</button><button id="n">لا</button></div></div>';
 m.style.display='flex';$('n').onclick=close;
 $('y').onclick=function(){yes()};
 m.onclick=function(e){if(e.target===m)close()};
}
function close(){$('m').style.display='none';$('m').innerHTML='';render()}

function dayCases(){var b=S.cases[v.b]||{};return b[v.d]||[]}
function setDay(a){S.cases[v.b]=S.cases[v.b]||{};if(a.length)S.cases[v.b][v.d]=a;else delete S.cases[v.b][v.d];save()}

function render(){
 var a=$('app'),h='',L=S.labels;
 if(v.p=='home'){
  h+='<h1>'+esc(S.title)+'</h1><p class="s">اختر الفرع</p>';
  if(!S.branches.length)h+='<div class="empty">لا توجد فروع. أضف فرعاً للبدء.</div>';
  S.branches.forEach(function(b){h+='<div class="card"><div class="g bn" data-a="open" data-i="'+b.id+'">'+esc(b.name)+'</div><button data-a="ebr" data-i="'+b.id+'">تعديل</button></div>'});
  h+='<div class="row"><button class="pri" data-a="abr">+ إضافة فرع</button><button data-a="set">الإعدادات</button></div>';
 }else if(v.p=='branch'){
  var br=S.branches.filter(function(x){return x.id==v.b})[0];
  if(!br){v.p='home';return render()}
  var cs=dayCases(),np=0;cs.forEach(function(c){if(c.pr!==false)np++});
  var wd='';try{wd=new Date(v.d+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long'})}catch(e){}
  h+='<div class="bar"><button data-a="home">رجوع</button><div class="t">'+esc(br.name)+'</div></div>';
  h+='<div class="dn"><button data-a="prev">&rsaquo;</button><input type="date" id="dt" value="'+v.d+'"><button data-a="next">&lsaquo;</button></div>';
  h+='<div class="sum">'+esc(wd)+' — '+esc(L.present)+': '+np+' — '+esc(L.absent)+': '+(cs.length-np)+' — الإجمالي: '+cs.length+'</div>';
  if(!cs.length)h+='<div class="empty">لا توجد حالات في هذا اليوم. اضغط «إضافة حالة».</div>';
  cs.forEach(function(c){
   var p=c.pr!==false;
   h+='<div class="card"><div class="g" data-a="ec" data-i="'+c.id+'"><div class="bn">'+esc(c.name)+'</div>'
   +(c.section?'<span class="chip">'+esc(c.section)+'</span>':'')+'</div>'
   +'<button class="'+(p?'pr':'ab')+'" data-a="tg" data-i="'+c.id+'">'+esc(p?L.present:L.absent)+'</button></div>';
  });
  h+='<button class="pri fab" data-a="ac">+ إضافة حالة</button>';
 }else{
  h+='<div class="bar"><button data-a="home">رجوع</button><div class="t">الإعدادات</div></div>';
  h+='<div class="card"><div class="g" data-a="etitle"><b>اسم البرنامج</b><div class="mu">'+esc(S.title)+'</div></div></div>';
  h+='<div class="card"><div class="g" data-a="elab"><b>تعديل أسماء الحقول</b><div class="mu">'+Object.keys(L).map(function(k){return esc(L[k])}).join('، ')+'</div></div></div>';
  h+='<h3 style="margin-top:18px">الأقسام</h3>';
  S.sections.forEach(function(s,i){h+='<div class="card"><div class="g" data-a="es" data-i="'+i+'">'+esc(s)+'</div><button data-a="es" data-i="'+i+'">تعديل</button></div>'});
  h+='<button class="pri" data-a="as" style="width:100%;margin-bottom:18px">+ إضافة قسم</button>';
  h+='<h3>نسخة احتياطية</h3><div class="row" style="margin-top:6px"><button data-a="exp">تصدير</button><button data-a="imp">استيراد</button></div>';
 }
 a.innerHTML=h;
 var dt=$('dt');if(dt)dt.onchange=function(){if(dt.value){v.d=dt.value;render()}};
}

function caseForm(c){
 var L=S.labels,isNew=!c;c=c||{id:uid(),name:'',section:S.sections[0]||'',pr:true};
 modal(isNew?'إضافة حالة':'تعديل الحالة',[
  {l:L.name,v:c.name},{l:L.section,v:c.section,o:S.sections},{l:'الحضور',v:c.pr!==false?L.present:L.absent,o:[L.present,L.absent]}],
 function(x){
  if(!x[0].trim()){alert(L.name+' مطلوب');return false}
  var n={id:c.id,name:x[0].trim(),section:x[1],pr:x[2]==L.present};
  var cs=dayCases().slice(),i=cs.findIndex(function(z){return z.id==c.id});
  if(i<0)cs.push(n);else cs[i]=n;setDay(cs);
 },isNew?null:function(){setDay(dayCases().filter(function(z){return z.id!=c.id}))});
}

document.body.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t||$('m').style.display=='flex')return;
 var a=t.dataset.a,i=t.dataset.i;
 if(a=='open'){v.p='branch';v.b=i;v.d=fmt(new Date());render()}
 else if(a=='home'){v.p='home';render()}
 else if(a=='set'){v.p='set';render()}
 else if(a=='prev'){v.d=shift(v.d,-1);render()}
 else if(a=='next'){v.d=shift(v.d,1);render()}
 else if(a=='ac')caseForm();
 else if(a=='ec')caseForm(dayCases().filter(function(z){return z.id==i})[0]);
 else if(a=='tg'){setDay(dayCases().map(function(z){if(z.id==i)z.pr=!(z.pr!==false);return z}));render()}
 else if(a=='abr')modal('إضافة فرع',[{l:'اسم الفرع',v:''}],function(x){if(!x[0].trim())return false;S.branches.push({id:uid(),name:x[0].trim()});save()});
 else if(a=='ebr'){var b=S.branches.filter(function(z){return z.id==i})[0];
  modal('تعديل الفرع',[{l:'اسم الفرع',v:b.name}],function(x){if(!x[0].trim())return false;b.name=x[0].trim();save()},
  function(){S.branches=S.branches.filter(function(z){return z.id!=i});delete S.cases[i];save()})}
 else if(a=='etitle')modal('اسم البرنامج',[{l:'الاسم',v:S.title}],function(x){S.title=x[0]||S.title;save()});
 else if(a=='elab'){var ks=Object.keys(S.labels),nm={name:'حقل الاسم',section:'حقل القسم',present:'كلمة الحضور',absent:'كلمة الغياب'};
  modal('أسماء الحقول',ks.map(function(k){return{l:nm[k]||k,v:S.labels[k]}}),
  function(x){ks.forEach(function(k,j){S.labels[k]=x[j]||S.labels[k]});save()})}
 else if(a=='as')modal('إضافة قسم',[{l:'اسم القسم',v:''}],function(x){if(!x[0].trim())return false;S.sections.push(x[0].trim());save()});
 else if(a=='es'){var old=S.sections[i];
  modal('تعديل القسم',[{l:'اسم القسم',v:old}],function(x){var nv=x[0].trim();if(!nv)return false;
   S.sections[i]=nv;
   Object.keys(S.cases).forEach(function(bk){Object.keys(S.cases[bk]).forEach(function(dk){S.cases[bk][dk].forEach(function(c){if(c.section==old)c.section=nv})})});save()},
  function(){S.sections.splice(i,1);save()})}
 else if(a=='exp')modal('نسخة احتياطية',[{l:'انسخ هذا النص واحفظه (واتساب / ملاحظات)',v:JSON.stringify(S),t:'area'}],function(){return true},null,'تم');
 else if(a=='imp')modal('استيراد نسخة',[{l:'الصق النص هنا (سيستبدل البيانات الحالية)',v:'',t:'area'}],function(x){
  try{var o=JSON.parse(x[0]);if(!o.branches)throw 0;S=o;S.labels=Object.assign({},DEF.labels,S.labels);save()}catch(err){alert('النص غير صالح');return false}},null,'استيراد');
});
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>يوميات علاج طبيعي</title>
<style>
:root{--bg:#eef6f4;--card:#fff;--tx:#17312d;--mu:#5d7a75;--ac:#0f766e;--ac2:#fbbf24;--bd:#cfe3de;--dn:#b42318;--ok:#15803d;--onac:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e1c;--card:#172b28;--tx:#e6f3f0;--mu:#8fb0aa;--ac:#2dd4bf;--ac2:#fbbf24;--bd:#27443f;--dn:#f97066;--ok:#4ade80;--onac:#06201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1e1c;--card:#172b28;--tx:#e6f3f0;--mu:#8fb0aa;--ac:#2dd4bf;--ac2:#fbbf24;--bd:#27443f;--dn:#f97066;--ok:#4ade80;--onac:#06201c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px}
#app{max-width:640px;margin:0 auto;padding:16px 14px 90px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:26px;margin:8px 0 4px}h3{margin:0 0 8px}
p.s{color:var(--mu);margin:0 0 16px}
button{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:11px 14px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:700}
button.dan{color:var(--dn);border-color:var(--dn)}
button.pr,button.ab{font-weight:700;min-width:64px;padding:10px 12px}
button.pr{color:var(--ok);border-color:var(--ok)}
button.ab{color:var(--dn);border-color:var(--dn)}
button.pr.on{background:var(--ok);color:var(--bg)}
button.ab.on{background:var(--dn);color:var(--bg)}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card .g{flex:1;cursor:pointer}
.kc{flex-direction:column;align-items:stretch;gap:10px}.kc .bn{cursor:pointer}
.bt{display:flex;gap:6px}.kc .bt select{flex:1.3;width:auto;min-width:0}.kc .bt button{flex:1}
.bn{font-size:18px;font-weight:700}
.mu{color:var(--mu);font-size:14px;margin-top:4px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.bar .t{flex:1;font-weight:700;font-size:19px}
.dn{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.dn input{flex:1;text-align:center;font-weight:700}
input,select,textarea{font:inherit;width:100%;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:90px}
.sum{color:var(--mu);margin:2px 2px 12px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;font-weight:700}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.st{display:flex;gap:8px;margin-bottom:12px}.st div{flex:1;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px 6px;text-align:center;color:var(--mu);font-size:13px}
.st b{display:block;font-size:28px;color:var(--tx)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--dn);font-weight:700}
.cnt{display:flex;gap:10px;font-size:14px;flex-wrap:wrap;justify-content:flex-end}
.wl{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.msg{background:var(--card);border:2px solid var(--ac);border-radius:20px;padding:26px 20px;font-size:21px;line-height:1.9;font-weight:700}
.big{font-size:20px;padding:16px}
#m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;z-index:20}
.box{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px}
.box label{display:block;margin:10px 0 4px;color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
#th{position:fixed;inset-inline-end:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;width:42px;height:42px;border-radius:50%;padding:0;font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#sig{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:var(--mu);opacity:.75;pointer-events:none;direction:ltr;z-index:4;letter-spacing:.3px}
</style>
</head>
<body>
<div id="app"></div>
<button id="th" aria-label="تبديل الوضع"></button>
<div id="sig">create by katim ali</div>
<div id="m"></div>
<script>
var K='pedpt_v2',TH='pt_theme';
var DEF={title:'يوميات علاج طبيعي',
 labels:{name:'اسم الطفل',present:'حضر',absent:'غاب',h1:'ساعة',h2:'ساعتين'},
 branches:[{id:'b1',name:'الفرع الأول'}],kids:{},att:{},mi:null,
 msgs:["يا دكتور، كل ابتسامة طفل بيقف على رجله وراها إيدك. كمّل!",
"صباح الخير يا بطل، النهارده يوم جديد وفرصة جديدة تفرّح بيها طفل وأهله.",
"إيدك بتعمل فرق حقيقي في حياة ناس كتير، ربنا يبارك فيها.",
"صبرك مع الأطفال أجر كبير، وربنا مش بيضيّع تعب حد.",
"كل جلسة خطوة صغيرة، والخطوات الصغيرة هي اللي بتوصّل لحاجات كبيرة.",
"إنت مش بس دكتور، إنت أمل لأهالي كتير. فخورين بيك!",
"ابدأ يومك بنفس طويل وقلب كبير، والباقي على ربنا.",
"ربنا يوفقك النهارده ويسهّل عليك كل جلسة.",
"مفيش أحلى من لحظة طفل يعمل حاجة كان شايفها مستحيلة، وإنت السبب في اللحظات دي.",
"تعبك النهارده هيبقى فرحة بكرة في عيون أطفالك.",
"شغلك رسالة مش وظيفة، وإنت بتؤديها على أكمل وجه.",
"يوم جميل وشغل جامد، يلا بينا نفرّح الأطفال!",
"كل طفل ليه سرعته، وإنت أحسن حد بيعرف يمشي معاه على راحته.",
"ربنا يديك الصحة والقوة، وكل طفل بيخرج من عندك أحسن من ما دخل.",
"إنت بتزرع النهارده، وبكرة هتشوف الحصاد في خطوات أطفالك.",
"ابتسامتك للطفل بتفرق معاه قد الجلسة نفسها.",
"يا دكتور، إيدك خير وبركة. كمّل وإحنا معاك!",
"التقدم مش دايمًا سريع، بس عمره ما بيخيب. إنت ماشي صح.",
"كفاية إنك بتحاول كل يوم، وده أصلاً نص النجاح.",
"النهارده يوم تاني تسعد فيه أطفال محتاجين لإيدك الحنينة.",
"ربنا يجبر بخاطرك زي ما بتجبر بخاطر الأطفال وأهاليهم.",
"خد نفس عميق وابدأ شغلك بروح حلوة، وإنت هتبدع زي كل يوم.",
"كل اسم في القايمة ليه حكاية، وإنت جزء حلو من الحكاية دي.",
"شغلك مش سهل، بس إنت قده وزيادة.",
"الأطفال مستنيينك، وإنت دايمًا عند حسن ظنهم.",
"ربنا يبارك في وقتك ومجهودك ويرزقك من حيث لا تحتسب.",
"اللي بتعمله بيفرق، حتى لو محدش قالك شكرًا النهارده. شكرًا يا دكتور!",
"يلا نبدأ بنفس جديد، ونخلي النهارده أحسن من إمبارح.",
"إنت سبب إن أهالي كتير بيقولوا الحمد لله، ولادنا في إيد أمينة.",
"ابدأ بسم الله، والباقي على ربنا وعلى إيدك الشاطرة."]};
function clone(o){return JSON.parse(JSON.stringify(o))}
function migrate(o){
 var n=clone(DEF);if(o.title)n.title=o.title;if(o.branches)n.branches=o.branches;
 var L=o.labels||{};['name','present','absent'].forEach(function(k){if(L[k])n.labels[k]=L[k]});
 Object.keys(o.cases||{}).forEach(function(b){n.kids[b]=[];n.att[b]={};var ids={};
  Object.keys(o.cases[b]).forEach(function(d){n.att[b][d]={};o.cases[b][d].forEach(function(c){
   if(!ids[c.name]){ids[c.name]=c.id;n.kids[b].push({id:c.id,name:c.name})}
   n.att[b][d][ids[c.name]]=c.pr!==false})})});
 return n}
function fix(o){for(var k in DEF)if(!(k in o))o[k]=clone(DEF[k]);o.labels=Object.assign({},DEF.labels,o.labels);
 if(o.title==='سجل الحالات')o.title=DEF.title;if(!o.msgs||!o.msgs.length)o.msgs=clone(DEF.msgs);return o}
function load(){try{var r=localStorage.getItem(K);if(r)return fix(JSON.parse(r));
 var old=localStorage.getItem('pedpt_v1');if(old)return fix(migrate(JSON.parse(old)))}catch(e){}return clone(DEF)}
var S=load(),v={p:'home',b:null,d:fmt(new Date()),tab:'day',m:fmt(new Date()).slice(0,7),k:null,q:'',msg:''},pend={};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shift(d,n){var t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return fmt(t)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(i){return document.getElementById(i)}
function norm(s){return String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim()}

/* theme */
function isDark(){var t=document.documentElement.getAttribute('data-theme');return t?t=='dark':window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches}
function thIcon(){$('th').textContent=isDark()?'☀️':'🌙'}
try{var tt=localStorage.getItem(TH);if(tt)document.documentElement.setAttribute('data-theme',tt)}catch(e){}
$('th').onclick=function(){var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem(TH,n)}catch(e){}thIcon()};
thIcon();

function modal(title,fields,onSave,onDel,okText,delMsg){
 var m=$('m'),h='<div class="box"><h3>'+esc(title)+'</h3>';
 fields.forEach(function(f,i){
  h+='<label>'+esc(f.l)+'</label>';
  if(f.t=='area')h+='<textarea id="f'+i+'"'+(f.h?' style="min-height:'+f.h+'px"':'')+'>'+esc(f.v)+'</textarea>';
  else h+='<input id="f'+i+'" type="text" value="'+esc(f.v)+'">';
 });
 h+='<div class="row"><button class="pri" id="ok">'+(okText||'حفظ')+'</button>'+(onDel?'<button class="dan" id="del">حذف</button>':'')+'<button id="no">إلغاء</button></div></div>';
 m.innerHTML=h;m.style.display='flex';
 $('no').onclick=close;
 $('ok').onclick=function(){var vals=fields.map(function(f,i){return $('f'+i).value});if(onSave(vals)!==false)close()};
 if(onDel)$('del').onclick=function(){ask(delMsg||'هل أنت متأكد من الحذف؟',function(){onDel();close()})};
 m.onclick=function(e){if(e.target===m)close()};
}
function ask(msg,yes){
 var m=$('m');
 m.innerHTML='<div class="box"><h3>'+esc(msg)+'</h3><div class="row"><button class="dan" id="y">نعم</button><button id="n">لا</button></div></div>';
 m.style.display='flex';$('n').onclick=close;
 $('y').onclick=function(){yes()};
 m.onclick=function(e){if(e.target===m)close()};
}
function sumBox(text){
 var m=$('m');
 m.innerHTML='<div class="box"><h3>الملخص الشهري</h3><textarea id="st" readonly style="min-height:260px">'+esc(text)+'</textarea><div class="row"><button class="pri" id="cp">نسخ</button><button id="wa">واتساب</button><button id="no">إغلاق</button></div></div>';
 m.style.display='flex';$('no').onclick=close;
 $('cp').onclick=function(){var ta=$('st');ta.select();ta.setSelectionRange(0,99999);var ok=false;
  try{if(navigator.clipboard){navigator.clipboard.writeText(text);ok=true}}catch(e){}
  if(!ok){try{document.execCommand('copy')}catch(e){}}
  $('cp').textContent='تم النسخ ✓'};
 $('wa').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')};
 m.onclick=function(e){if(e.target===m)close()};
}
function close(){$('m').style.display='none';$('m').innerHTML='';render()}

function kidsOf(b){return S.kids[b]||[]}
function dayAtt(){return (S.att[v.b]||{})[v.d]||{}}
function present(x){return x!==undefined&&x!==false}
function sess(x){return x===false||x===undefined?0:(x===true?1:(+x||1))}
function put(id,val){S.att[v.b]=S.att[v.b]||{};var d=S.att[v.b][v.d]=S.att[v.b][v.d]||{};
 if(val===undefined)delete d[id];else d[id]=val;if(!Object.keys(d).length)delete S.att[v.b][v.d];save()}
function shiftM(m,n){var d=new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function mName(m){try{return new Date(m+'-01T12:00:00').toLocaleDateString('ar-EG',{month:'long',year:'numeric'})}catch(e){return m}}
function stats(id){var A=S.att[v.b]||{},p=0,a=0,s=0;
 Object.keys(A).forEach(function(d){var x=A[d][id];if(d.indexOf(v.m)==0&&x!==undefined){if(x===false)a++;else{p++;s+=sess(x)}}});
 return{p:p,a:a,s:s}}
function mNav(){return '<div class="dn"><button data-a="mprev">&rsaquo;</button><div class="bn" style="flex:1;text-align:center">'+esc(mName(v.m))+'</div><button data-a="mnext">&lsaquo;</button></div>'}
function curBranch(){return S.branches.filter(function(x){return x.id==v.b})[0]}
function fk(ks){var q=norm(v.q);return q?ks.filter(function(k){return norm(k.name).indexOf(q)>=0}):ks}
function sbox(){return '<input id="q" type="search" placeholder="بحث بالاسم" value="'+esc(v.q)+'" style="margin-bottom:10px">'}
function durLabel(n){return n==1?S.labels.h1:n==2?S.labels.h2:n+' جلسات'}
function stBox(a,b,c,L){return '<div class="st"><div><b class="ok">'+a+'</b>'+esc(L.present)+'</div><div><b class="no">'+b+'</b>'+esc(L.absent)+'</div><div><b>'+c+'</b>إجمالي الجلسات</div></div>'}

function dayList(){
 var at=dayAtt(),L=S.labels,h='',ks=fk(kidsOf(v.b));
 if(!ks.length)return '<div class="empty">لا توجد نتائج</div>';
 ks.forEach(function(k){
  var x=at[k.id],pr=present(x),d=pr?sess(x):(pend[k.id]||1);
  h+='<div class="card kc"><div class="bn" data-a="kd" data-i="'+k.id+'">'+esc(k.name)+'</div><div class="bt">'
  +'<select class="du" data-k="'+k.id+'"><option value="1"'+(d==1?' selected':'')+'>'+esc(L.h1)+'</option><option value="2"'+(d==2?' selected':'')+'>'+esc(L.h2)+'</option></select>'
  +'<button class="pr'+(pr?' on':'')+'" data-a="sp" data-i="'+k.id+'">'+esc(L.present)+'</button>'
  +'<button class="ab'+(x===false?' on':'')+'" data-a="sa" data-i="'+k.id+'">'+esc(L.absent)+'</button></div></div>';
 });
 return h}
function monthList(){
 var L=S.labels,h='',ks=fk(kidsOf(v.b));
 if(!ks.length)return '<div class="empty">لا توجد نتائج</div>';
 ks.forEach(function(k){var t=stats(k.id);
  h+='<div class="card"><div class="g bn" data-a="kd" data-i="'+k.id+'">'+esc(k.name)+'</div><div class="cnt"><span class="ok">'+esc(L.present)+' '+t.p+'</span><span class="no">'+esc(L.absent)+' '+t.a+'</span><span>جلسات '+t.s+'</span></div></div>'});
 return h}
function kidsList(){
 var h='',ks=fk(kidsOf(v.b));
 if(!ks.length)return '<div class="empty">'+(kidsOf(v.b).length?'لا توجد نتائج':'القائمة فاضية. اضغط «إضافة أطفال».')+'</div>';
 ks.forEach(function(k){h+='<div class="card"><div class="g bn" data-a="ek" data-i="'+k.id+'">'+esc(k.name)+'</div><button data-a="ek" data-i="'+k.id+'">تعديل</button></div>'});
 return h}
function listHtml(){return v.p=='kids'?kidsList():v.tab=='month'?monthList():dayList()}
function monthText(){
 var br=curBranch(),L=S.labels,tp=0,ta=0,ts=0,t=S.title+'\nالفرع: '+br.name+'\nالشهر: '+mName(v.m)+'\n————————\n';
 kidsOf(v.b).forEach(function(k,i){var r=stats(k.id);tp+=r.p;ta+=r.a;ts+=r.s;
  t+=(i+1)+'. '+k.name+': '+L.present+' '+r.p+' | '+L.absent+' '+r.a+' | جلسات '+r.s+'\n'});
 return t+'————————\nالإجمالي: '+L.present+' '+tp+' | '+L.absent+' '+ta+' | جلسات '+ts}

function render(){
 var a=$('app'),h='',L=S.labels;document.title=S.title;
 if(v.p=='home'){
  h+='<h1>'+esc(S.title)+'</h1><p class="s">اختر الفرع</p>';
  if(!S.branches.length)h+='<div class="empty">لا توجد فروع. أضف فرعاً للبدء.</div>';
  S.branches.forEach(function(b){h+='<div class="card"><div class="g bn" data-a="open" data-i="'+b.id+'">'+esc(b.name)+'</div><button data-a="ebr" data-i="'+b.id+'">تعديل</button></div>'});
  h+='<div class="row"><button class="pri" data-a="abr">+ إضافة فرع</button><button data-a="set">الإعدادات</button></div>';
 }else if(v.p=='welcome'){
  var wb=curBranch();if(!wb){v.p='home';return render()}
  h+='<div class="wl"><h1>'+esc(wb.name)+'</h1><div class="msg">'+esc(v.msg)+'</div><button class="pri big" data-a="enter">خش برجلك اليمين</button><button data-a="home">رجوع</button></div>';
 }else if(v.p=='branch'){
  var br=curBranch();if(!br){v.p='home';return render()}
  var ks=kidsOf(v.b);
  h+='<div class="bar"><button data-a="home">رجوع</button><div class="t">'+esc(br.name)+'</div><button data-a="kids">الأطفال</button></div>';
  h+='<div class="tabs"><button class="'+(v.tab=='day'?'on':'')+'" data-a="tabd">اليوم</button><button class="'+(v.tab=='month'?'on':'')+'" data-a="tabm">إجمالي الشهر</button></div>';
  if(v.tab=='day'){
   var at=dayAtt(),np=0,na=0,ts=0;
   ks.forEach(function(k){var x=at[k.id];if(x===false)na++;else if(present(x)){np++;ts+=sess(x)}});
   var wd='';try{wd=new Date(v.d+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long'})}catch(e){}
   h+='<div class="dn"><button data-a="prev">&rsaquo;</button><input type="date" id="dt" value="'+v.d+'"><button data-a="next">&lsaquo;</button></div>';
   h+='<div class="sum">'+esc(wd)+' — لم يُسجل: '+(ks.length-np-na)+'</div>'+stBox(np,na,ts,L);
   if(!ks.length)h+='<div class="empty">لا يوجد أطفال في هذا الفرع.<br><br><button class="pri" data-a="kids">إضافة الأطفال</button></div>';
   else h+='<button data-a="allp" style="width:100%;margin-bottom:10px">الكل: '+esc(L.present)+'</button>'+sbox()+'<div id="lst">'+dayList()+'</div>';
  }else{
   var tp=0,ta=0,tt2=0;
   ks.forEach(function(k){var t=stats(k.id);tp+=t.p;ta+=t.a;tt2+=t.s});
   h+=mNav()+stBox(tp,ta,tt2,L);
   if(!ks.length)h+='<div class="empty">لا يوجد أطفال في هذا الفرع.</div>';
   else h+='<button class="pri" data-a="msum" style="width:100%;margin-bottom:10px">ملخص الشهر (نسخ / واتساب)</button>'+sbox()+'<div id="lst">'+monthList()+'</div>';
  }
 }else if(v.p=='kid'){
  var kd=kidsOf(v.b).filter(function(z){return z.id==v.k})[0];if(!kd){v.p='branch';return render()}
  var t2=stats(kd.id),A2=S.att[v.b]||{},ds=Object.keys(A2).filter(function(d){return d.indexOf(v.m)==0&&A2[d][kd.id]!==undefined}).sort();
  h+='<div class="bar"><button data-a="back">رجوع</button><div class="t">'+esc(kd.name)+'</div></div>'+mNav()+stBox(t2.p,t2.a,t2.s,L);
  if(!ds.length)h+='<div class="empty">لا توجد جلسات مسجلة في هذا الشهر.</div>';
  ds.forEach(function(d){var lb=d;try{lb=new Date(d+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}catch(e){}
   var x=A2[d][kd.id],pr=present(x);
   h+='<div class="card"><div class="g">'+esc(lb)+'</div><span class="'+(pr?'ok':'no')+'">'+esc(pr?L.present+' · '+durLabel(sess(x)):L.absent)+'</span></div>'});
 }else if(v.p=='kids'){
  var b2=curBranch();if(!b2){v.p='home';return render()}
  h+='<div class="bar"><button data-a="back">رجوع</button><div class="t">أطفال '+esc(b2.name)+'</div></div>';
  if(kidsOf(v.b).length)h+=sbox();
  h+='<div id="lst">'+kidsList()+'</div><button class="pri" data-a="ak" style="width:100%">+ إضافة أطفال</button>';
 }else{
  h+='<div class="bar"><button data-a="home">رجوع</button><div class="t">الإعدادات</div></div>';
  h+='<div class="card"><div class="g" data-a="etitle"><b>اسم البرنامج</b><div class="mu">'+esc(S.title)+'</div></div></div>';
  h+='<div class="card"><div class="g" data-a="elab"><b>تعديل أسماء الحقول</b><div class="mu">'+['name','present','absent','h1','h2'].map(function(k){return esc(L[k])}).join('، ')+'</div></div></div>';
  h+='<div class="card"><div class="g" data-a="emsg"><b>رسائل التشجيع</b><div class="mu">'+S.msgs.length+' رسالة</div></div></div>';
  h+='<h3 style="margin-top:18px">نسخة احتياطية</h3><div class="row" style="margin-top:6px"><button data-a="exp">تصدير</button><button data-a="imp">استيراد</button></div>';
 }
 a.innerHTML=h;
 var dt=$('dt');if(dt)dt.onchange=function(){if(dt.value){v.d=dt.value;pend={};render()}};
}

document.body.addEventListener('input',function(e){if(e.target.id=='q'){v.q=e.target.value;$('lst').innerHTML=listHtml()}});
document.body.addEventListener('change',function(e){
 var t=e.target;if(!t.classList||!t.classList.contains('du'))return;
 var id=t.dataset.k,val=+t.value;
 if(present(dayAtt()[id])){put(id,val);render()}else pend[id]=val;
});
document.body.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t||$('m').style.display=='flex')return;
 var a=t.dataset.a,i=t.dataset.i;
 if(['open','enter','tabd','tabm','kids','back','home','set','kd'].indexOf(a)>=0)v.q='';
 if(a=='open'){
  var M=S.msgs.length?S.msgs:DEF.msgs;if(S.mi==null||isNaN(S.mi))S.mi=Math.floor(Math.random()*M.length);
  v.msg=M[S.mi%M.length];S.mi=(S.mi+1)%M.length;save();
  v.p='welcome';v.b=i;render()}
 else if(a=='enter'){v.p='branch';v.d=fmt(new Date());v.tab='day';v.m=v.d.slice(0,7);pend={};render()}
 else if(a=='tabd'){v.tab='day';render()}
 else if(a=='tabm'){v.tab='month';v.m=v.d.slice(0,7);render()}
 else if(a=='mprev'){v.m=shiftM(v.m,-1);render()}
 else if(a=='mnext'){v.m=shiftM(v.m,1);render()}
 else if(a=='kd'){v.k=i;v.p='kid';if(v.tab=='day')v.m=v.d.slice(0,7);render()}
 else if(a=='home'){v.p='home';render()}
 else if(a=='back'){v.p='branch';render()}
 else if(a=='kids'){v.p='kids';render()}
 else if(a=='set'){v.p='set';render()}
 else if(a=='prev'){v.d=shift(v.d,-1);pend={};render()}
 else if(a=='next'){v.d=shift(v.d,1);pend={};render()}
 else if(a=='sp'){if(present(dayAtt()[i]))put(i,undefined);else put(i,pend[i]||1);render()}
 else if(a=='sa'){if(dayAtt()[i]===false)put(i,undefined);else put(i,false);render()}
 else if(a=='allp'){kidsOf(v.b).forEach(function(k){put(k.id,pend[k.id]||(present(dayAtt()[k.id])?dayAtt()[k.id]:1))});render()}
 else if(a=='msum')sumBox(monthText());
 else if(a=='ak')modal('إضافة أطفال',[{l:'اكتب اسم كل طفل في سطر',v:'',t:'area'}],function(x){
  var n=x[0].split('\n').map(function(z){return z.trim()}).filter(Boolean);if(!n.length)return false;
  S.kids[v.b]=kidsOf(v.b).concat(n.map(function(z){return{id:uid(),name:z}}));save()});
 else if(a=='ek'){var k=kidsOf(v.b).filter(function(z){return z.id==i})[0];
  modal('تعديل الطفل',[{l:S.labels.name,v:k.name}],function(x){if(!x[0].trim())return false;k.name=x[0].trim();save()},
  function(){S.kids[v.b]=kidsOf(v.b).filter(function(z){return z.id!=i});
   Object.keys(S.att[v.b]||{}).forEach(function(d){delete S.att[v.b][d][i];if(!Object.keys(S.att[v.b][d]).length)delete S.att[v.b][d]});save()},
  null,'سيتم حذف الطفل وكل سجل حضوره. هل أنت متأكد؟')}
 else if(a=='abr')modal('إضافة فرع',[{l:'اسم الفرع',v:''}],function(x){if(!x[0].trim())return false;S.branches.push({id:uid(),name:x[0].trim()});save()});
 else if(a=='ebr'){var b=S.branches.filter(function(z){return z.id==i})[0];
  modal('تعديل الفرع',[{l:'اسم الفرع',v:b.name}],function(x){if(!x[0].trim())return false;b.name=x[0].trim();save()},
  function(){S.branches=S.branches.filter(function(z){return z.id!=i});delete S.kids[i];delete S.att[i];save()},
  null,'سيتم حذف الفرع وكل أطفاله وسجلاته. هل أنت متأكد؟')}
 else if(a=='etitle')modal('اسم البرنامج',[{l:'الاسم',v:S.title}],function(x){S.title=x[0]||S.title;save()});
 else if(a=='elab'){var ks=['name','present','absent','h1','h2'],nm={name:'حقل الاسم',present:'كلمة الحضور',absent:'كلمة الغياب',h1:'مدة الجلسة الأولى (تُحسب جلسة)',h2:'مدة الجلسة الثانية (تُحسب جلستين)'};
  modal('أسماء الحقول',ks.map(function(k){return{l:nm[k],v:S.labels[k]}}),
  function(x){ks.forEach(function(k,j){S.labels[k]=x[j]||S.labels[k]});save()})}
 else if(a=='emsg')modal('رسائل التشجيع',[{l:'اكتب كل رسالة في سطر',v:S.msgs.join('\n'),t:'area',h:300}],function(x){
  var n=x[0].split('\n').map(function(z){return z.trim()}).filter(Boolean);S.msgs=n.length?n:clone(DEF.msgs);save()});
 else if(a=='exp')modal('نسخة احتياطية',[{l:'انسخ هذا النص واحفظه (واتساب / ملاحظات)',v:JSON.stringify(S),t:'area'}],function(){return true},null,'تم');
 else if(a=='imp')modal('استيراد نسخة',[{l:'الصق النص هنا (سيستبدل البيانات الحالية)',v:'',t:'area'}],function(x){
  try{var o=JSON.parse(x[0]);if(!o.branches)throw 0;S=fix(o.cases?migrate(o):o);S.kids=S.kids||{};S.att=S.att||{};save()}catch(err){alert('النص غير صالح');return false}},null,'استيراد');
});
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
